backend:
  name: git-gateway
  branch: main

media_folder: "imagenes"
public_folder: "/imagenes"

locale: "es"

collections:

  # ── REFLEXIONES (Blog) ──────────────────────────
  - name: "reflexiones"
    label: "Reflexiones"
    folder: "_reflexiones"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Estrategia", value: "estrategia" }
          - { label: "Cultura", value: "cultura" }
          - { label: "Liderazgo", value: "liderazgo" }
          - { label: "Propósito", value: "proposito" }
      - { label: "Extracto", name: "extracto", widget: "text", hint: "2-3 líneas para la lista de reflexiones" }
      - { label: "Imagen de portada (opcional)", name: "imagen", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Publicado", name: "publicado", widget: "boolean", default: true }

  # ── SLIDES DEL HERO ─────────────────────────────
  - name: "hero_slides"
    label: "Slides del Hero"
    folder: "_slides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Título (línea 2, en itálica)", name: "titulo_italica", widget: "string", required: false }
      - { label: "Subtítulo", name: "subtitulo", widget: "text" }
      - label: "Tipo de fondo"
        name: "tipo"
        widget: "select"
        options:
          - { label: "Azul Oreka", value: "azul" }
          - { label: "Oscuro", value: "oscuro" }
          - { label: "Tierra", value: "tierra" }
          - { label: "Foto", value: "foto" }
      - { label: "Imagen de fondo (si tipo = foto)", name: "imagen", widget: "image", required: false }
      - { label: "Texto del botón principal", name: "btn_texto", widget: "string", required: false }
      - { label: "URL del botón principal", name: "btn_url", widget: "string", required: false }
      - { label: "Badge (ej. Nuevo, Última reflexión)", name: "badge", widget: "string", required: false }
      - { label: "Orden", name: "orden", widget: "number", default: 1 }
      - { label: "Activo", name: "activo", widget: "boolean", default: true }

  # ── PÁGINAS — TEXTOS EDITABLES ──────────────────
  - name: "paginas"
    label: "Páginas"
    files:

      - label: "Home"
        name: "home"
        file: "_contenido/home.md"
        fields:
          - { label: "Hero — Título", name: "hero_titulo", widget: "string" }
          - { label: "Hero — Subtítulo", name: "hero_subtitulo", widget: "text" }
          - { label: "Para quién — Título", name: "quien_titulo", widget: "string" }

      - label: "Quiénes Somos"
        name: "quienes"
        file: "_contenido/quienes.md"
        fields:
          - { label: "Título del header", name: "header_titulo", widget: "string" }
          - { label: "Subtítulo del header", name: "header_sub", widget: "text" }
          - { label: "Texto del origen", name: "origen_texto", widget: "markdown" }
          - { label: "Texto de cómo trabajamos", name: "como_texto", widget: "markdown" }

      - label: "Contacto"
        name: "contacto"
        file: "_contenido/contacto.md"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Subtítulo", name: "subtitulo", widget: "text" }
          - { label: "Número de WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Correo de contacto", name: "correo", widget: "string" }
          - { label: "URL de LinkedIn", name: "linkedin", widget: "string" }
